version: '3.9'

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - course-bot-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-course_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_bot}
      POSTGRES_DB: ${POSTGRES_DB:-course_bot}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-course_bot}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - course-bot-net

volumes:
  db-data:

networks:
  course-bot-net:
